[project]
name = "training-classifier"
version = "0.1.0"
description = "Pull Garmin Connect training history, tidy it into DataFrames, visualise it, and (eventually) classify activities from sensor data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.2",
    "datetime>=6.0",
    "duckdb>=1.5.5",
    "garminconnect>=0.3.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "ruff>=0.16.5",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "NPY", "PD"]
